[project]
name = "avatar"
version = "0.1.0"
description = "Hand visual teleoperation for SO101 robot arm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "mujoco>=3.0",
    "numpy>=1.24",
    "pin>=4.0",
    "torch>=2.0",
    "timm>=0.9",
    "hidapi>=0.15.0",
    "joycon-python>=0.2.4",
    "pyglm>=2.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
