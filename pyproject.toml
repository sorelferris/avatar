[project]
name = "avatar"
version = "0.1.0"
description = "Hand visual teleoperation for G1 humanoid robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "mujoco>=3.0",
    "numpy>=1.24",
    "torch>=2.0",
    "timm>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
